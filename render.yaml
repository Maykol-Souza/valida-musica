# Blueprint opcional do Render (Dashboard > New > Blueprint).
# Se preferir, configure manualmente pelo dashboard (ver README) — dá no mesmo.
services:
  - type: web
    name: revisor-musical-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
