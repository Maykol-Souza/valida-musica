[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Proxy transparente: o browser continua chamando "/api/..." (mesma origem),
# a Netlify repassa para o backend no Render. Evita CORS e não exige alterar
# o código do frontend. Troque a URL abaixo pela URL real do serviço no Render
# depois do primeiro deploy do backend.
[[redirects]]
  from = "/api/*"
  to = "https://SEU-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true
